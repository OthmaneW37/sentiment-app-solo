name: CI
on: [push, pull_request]
jobs:
  tp1-tp3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Environnement virtuel et dépendances
        run: >-
          python -m venv .venv && . .venv/bin/activate &&
          pip install "pandas==2.2.*" "scikit-learn==1.5.*" "joblib==1.4.*"
          "pytest==8.3.*" "fastapi==0.115.*" "pydantic==2.9.*"
          "httpx==0.27.*" "uvicorn==0.30.*" "streamlit==1.39.*"
      - name: Diagnostic
        run: . .venv/bin/activate && python scripts/check_setup.py
      - name: Modèle de démonstration, pour les tests de l'API (TP3)
        run: . .venv/bin/activate && python src/make_demo.py && python src/train.py
      - name: Tests
        run: . .venv/bin/activate && python -m pytest -q
